name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  agent:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          pip install -r src/requirements.txt
          pip install -r requirements-dev.txt
      - name: Lint
        run: flake8 src tests
      - name: Test
        run: pytest
