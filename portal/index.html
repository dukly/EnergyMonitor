<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>САНХОРС Мониторинг</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="header">
    <div class="brand">
      <span class="logo">САНХОРС</span>
      <span class="subtitle">Мониторинг СЭС</span>
    </div>
    <a class="link" href="https://sunhors.ru/" target="_blank" rel="noopener">sunhors.ru</a>
  </header>

  <main class="container">
    <section class="panel">
      <h1>Личный кабинет (MVP)</h1>
      <label>API URL <input id="apiUrl" type="text" value="http://localhost:8000" /></label>
      <label>Site ID <input id="siteId" type="text" value="demo-site" /></label>
      <button id="refreshBtn">Обновить данные</button>
    </section>

    <section class="cards" id="dashboard">
      <article class="card"><h3>Мощность AC</h3><p id="powerAc">—</p></article>
      <article class="card"><h3>Энергия за день</h3><p id="energyDay">—</p></article>
      <article class="card"><h3>Статус</h3><p id="status">—</p></article>
      <article class="card"><h3>Ошибка</h3><p id="error">—</p></article>
    </section>

    <section class="panel">
      <h2>История мощности</h2>
      <canvas id="chart" width="800" height="240"></canvas>
    </section>

    <section class="panel muted">
      <h2>Уведомления (MVP)</h2>
      <ul id="alerts">
        <li>Алерты SMS/email — в разработке (фаза 2)</li>
      </ul>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
