services:
  postgres:
    image: timescale/timescaledb:latest-pg16
    environment:
      POSTGRES_USER: sunhors
      POSTGRES_PASSWORD: sunhors
      POSTGRES_DB: sunhors
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data

  cloud-api:
    build:
      context: ../cloud
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql://sunhors:sunhors@postgres:5432/sunhors
    ports:
      - '8000:8000'
    depends_on:
      - postgres

  portal:
    image: nginx:alpine
    ports:
      - '8080:80'
    volumes:
      - ../portal:/usr/share/nginx/html:ro
    depends_on:
      - cloud-api

volumes:
  pgdata:
